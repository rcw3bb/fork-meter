[project]
name = "fork-meter"
version = "1.2.0"
description = "A command-line tool that measures cyclomatic complexity by counting decision points and branching paths in source code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ron Webb", email = "ron@ronella.xyz"}
]
requires-python = ">=3.14"
keywords = ["cyclomatic-complexity", "static-analysis", "code-quality", "linter", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "logenrich (>=1.0.1,<2.0.0)",
    "env-dir-bootstrap (>=1.0.0,<2.0.0)",
    "tree-sitter (>=0.26.0,<0.27.0)",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "tree-sitter-javascript (>=0.25.0,<0.26.0)",
    "tree-sitter-typescript (>=0.23.2,<0.24.0)",
    "tree-sitter-java (>=0.23.5,<0.24.0)",
    "tree-sitter-go (>=0.25.0,<0.26.0)",
    "tree-sitter-gosu (>=0.2.0,<0.3.0)",
    "click (>=8.4.2,<9.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "braincraft (>=1.3.1,<2.0.0)",
    "tree-sitter-c (>=0.24.2,<0.25.0)",
    "tree-sitter-cpp (>=0.23.4,<0.24.0)",
    "tree-sitter-c-sharp (>=0.23.5,<0.24.0)",
    "tree-sitter-rust (>=0.24.2,<0.25.0)",
    "tree-sitter-kotlin (>=1.1.0,<2.0.0)",
    "tree-sitter-scala (>=0.26.2,<0.27.0)"
]

[project.scripts]
fork-meter = "fork_meter.__main__:main"

[project.urls]
Homepage = "https://github.com/rcw3bb/fork-meter"
Repository = "https://github.com/rcw3bb/fork-meter"
Changelog = "https://github.com/rcw3bb/fork-meter/blob/main/CHANGELOG.md"
Issues = "https://github.com/rcw3bb/fork-meter/issues"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "fork_meter"}]
include = ["fork_meter/logging.ini", "fork_meter/fm_ignore", "fork_meter/config.ini", "CHANGELOG.md"]

[tool.pytest.ini_options]
addopts = "--cov=fork_meter tests --cov-report html --cov-fail-under=90"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
